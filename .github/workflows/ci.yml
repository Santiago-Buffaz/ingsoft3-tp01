name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests y exigir cobertura del backend
        run: |
          mkdir -p TestResults
          docker run --rm -v "$GITHUB_WORKSPACE/TestResults:/out" backend-test:ci

      - name: Reporte y resumen del backend
        if: ${{ !cancelled() }}
        run: |
          test -s TestResults/coverage.cobertura.xml
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.18
          reportgenerator -reports:TestResults/coverage.cobertura.xml -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cobertura y resultados del backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults
          if-no-files-found: error
          retention-days: 30

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/santiago-buffaz/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests y exigir cobertura del frontend
        run: |
          mkdir -p frontend-coverage
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "$GITHUB_WORKSPACE/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del frontend
        if: ${{ !cancelled() }}
        run: |
          test -s frontend-coverage/reporte/coverage-summary.json
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const t = JSON.parse(fs.readFileSync('frontend-coverage/reporte/coverage-summary.json', 'utf8')).total;
          if (!t.lines.total) {
            console.error('Se midieron cero líneas: revisar coverage.include');
            process.exit(1);
          }
          console.log('### Coverage del frontend');
          console.log('| Métrica | Porcentaje |');
          console.log('|---|---|');
          for (const metrica of ['lines', 'branches', 'functions']) {
            console.log(`| ${metrica} | ${t[metrica].pct}% |`);
          }
          NODE

      - name: Publicar cobertura del frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-frontend
          path: frontend-coverage
          if-no-files-found: error
          retention-days: 30

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/santiago-buffaz/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: qa
      url: ${{ vars.URL_FRONT }}
    steps:
      - name: Desplegar las imágenes verificadas en Render
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          test -n "$HOOK_API"
          test -n "$HOOK_FRONT"
          IMG_API="ghcr.io/santiago-buffaz/ingsoft3-tp01-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/santiago-buffaz/ingsoft3-tp01-frontend:sha-$GITHUB_SHA"
          echo "Imagen backend: $IMG_API"
          echo "Imagen frontend: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test de QA
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          test -n "$URL_API"
          test -n "$URL_FRONT"
          echo "Esperando a que QA responda..."
          for i in $(seq 1 30); do
            echo "Intento $i de 30"
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/clientes" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "QA responde: API, consulta a BD y frontend."
              exit 0
            fi
            sleep 20
          done
          echo "QA no respondió dentro del plazo."
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.URL_FRONT }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar las imágenes verificadas en Render
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          test -n "$HOOK_API"
          test -n "$HOOK_FRONT"
          IMG_API="ghcr.io/santiago-buffaz/ingsoft3-tp01-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/santiago-buffaz/ingsoft3-tp01-frontend:sha-$GITHUB_SHA"
          echo "Imagen backend: $IMG_API"
          echo "Imagen frontend: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test de PROD
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          test -n "$URL_API"
          test -n "$URL_FRONT"
          echo "Esperando a que PROD responda..."
          for i in $(seq 1 30); do
            echo "Intento $i de 30"
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/clientes" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "PROD responde: API, consulta a BD y frontend."
              exit 0
            fi
            sleep 20
          done
          echo "PROD no respondió dentro del plazo."
          exit 1
