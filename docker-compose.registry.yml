services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lexagenda
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lexagenda"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: ghcr.io/${REGISTRY_USER:-tu-usuario}/lexagenda-backend:v0.1.0
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      APP_TIME_ZONE: America/Argentina/Cordoba
      ConnectionStrings__Default: "Host=db;Database=lexagenda;Username=postgres;Password=${DB_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${REGISTRY_USER:-tu-usuario}/lexagenda-frontend:v0.1.0
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  db_data:
